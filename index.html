function openRoster(kind='weekday'){let source=kind==='weekday'?(roster?.days||Array.from({length:28},()=>({duty:'',start:'',end:''}))):(roster?.[kind]||seededDays(kind));let initial=source.map(midDefaults);let anchor=roster?.anchor||key(year,month,1);show(head('28日輪番の設定')+`<div class="roster-tabs"><button type="button" class="secondary" id="tabWeek">平日</button><button type="button" class="secondary" id="tabSat">土曜</button><button type="button" class="secondary" id="tabHoliday">日祝</button></div><p class="note">現在編集中：<strong>${{weekday:'平日',sat:'土曜',holiday:'日祝'}[kind]}</strong>。基準日には「輪番①に当たる日」を入力してください。①〜⑤勤務・⑥⑦公休を4回繰り返します。中休ダイヤは中間開放の開始・終了も登録できます。平日・土曜・日祝を自動判別します。公休日は四半期ごとに自動移動します。実際の表と照合して使用してください。</p><form id="rosterForm"><label class="field">輪番①の基準日<input name="anchor" type="date" required value="${esc(anchor)}"></label><div class="rostergrid">${initial.map((x,i)=>`<div class="rosteritem ${i%7>=5?'off':''}"><strong>${i+1<10?'0':''}${i+1} ${i%7>=5?'公休':'勤務日'}</strong>${i%7>=5?'<small>固定公休（試作）</small>':`<input name="d${i}" placeholder="ダイヤ名／空欄なら空番" value="${esc(x.duty||'')}"><input name="s${i}" type="time" value="${esc(x.start||'')}"><input name="e${i}" type="time" value="${esc(x.end||'')}"><small>中間開放（中休のみ）</small><input name="ms${i}" type="time" aria-label="中間開放開始" value="${esc(x.midStart||'')}"><input name="me${i}" type="time" aria-label="中間開放終了" value="${esc(x.midEnd||'')}">`}</div>`).join('')}</div><div class="setupactions"><button type="submit" class="primary">輪番を保存</button><button type="button" class="secondary" data-close>キャンセル</button></div></form>`);$('rosterForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);for(let i=0;i<28;i++){let a=f.get('ms'+i),b=f.get('me'+i),st=f.get('s'+i),en=f.get('e'+i);if(Boolean(a)!==Boolean(b)){alert('中間開放の開始と終了は両方入力してください（輪番'+(i+1)+'）。');return}if(a&&!(minutes(st)<=minutes(a)&&minutes(a)<minutes(b)&&minutes(b)<=minutes(en))){alert('中間開放の時刻を確認してください（輪番'+(i+1)+'）。');return}}const entries=Array.from({length:28},(_,i)=>({duty:f.get('d'+i)||'',start:f.get('s'+i)||'',end:f.get('e'+i)||'',midStart:f.get('ms'+i)||'',midEnd:f.get('me'+i)||''}));roster={...(roster||{}),anchor:f.get('anchor')};if(kind==='weekday')roster.days=entries;else roster[kind]=entries;localStorage.setItem(rosterKey,JSON.stringify(roster));close();render()};$('tabWeek').onclick=()=>openRoster('weekday');$('tabSat').onclick=()=>openRoster('sat');$('tabHoliday').onclick=()=>openRoster('holiday');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close)}
function lines(s){if(s.mode==='paid')return [s.base||s.duty||'勤務','有給'];if(s.mode==='off')return ['公休'];if(s.mode==='unset')return ['輪番未設定'];if(s.mode==='open')return ['空番'];if(s.mode==='assigned')return [s.base||'空番',s.duty||'ダイヤ未設定',s.start||'—',s.end||'—'];return [s.duty||s.base||'勤務',s.start||'—',s.end||'—']}
function render(){ $('rosterStatus').textContent=roster?.anchor?'輪番：設定済み（基準日 '+roster.anchor+'）':'輪番：未設定（設定すると自動表示）'; $('monthTitle').textContent=`${year}年 ${month+1}月`;const first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),total=Math.ceil((first+days)/7)*7;let html='';for(let i=0;i<total;i++){const d=i-first+1;if(d<1||d>days){html+='<div class="day outside"></div>';continue}const data=getDay(d),s=data.shift,items=lines(s),room=Math.max(0,6-items.length);const today=year===now.getFullYear()&&month===now.getMonth()&&d===now.getDate();html+=`<button class="day ${d===selected?'selected':''}" data-day="${d}"><span class="daynum ${today?'todaynum':''}">${d}</span><span class="shift ${s.mode==='paid'?'paid':s.mode==='unset'?'unset':s.mode==='off'||s.mode==='assigned'?'off':''}">${items.map(x=>`<span>${esc(x)}</span>`).join('')}</span>${data.events.slice(0,room).map(e=>`<span class="event">${esc(e.title)}</span>`).join('')}${data.events.length>room?`<span class="more">＋${data.events.length-room}件</span>`:''}</button>`} $('calendar').innerHTML=html;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.day);render();$('selectedTitle').scrollIntoView({behavior:'smooth',block:'nearest'})});$('selectedTitle').textContent=`${month+1}月${selected}日（${'日月火水木金土'[new Date(year,month,selected).getDay()]}）の予定`;const data=getDay(selected),s=data.shift;$('dayEntries').innerHTML=`<button class="entry" id="shiftEntry"><span><strong>${esc(lines(s)[0])}${s.mode==='paid'?' → 有給':s.mode==='assigned'?' → '+esc(s.duty):''}</strong><small>${s.mode==='paid'?'有給取得':s.mode==='off'?'公休':s.mode==='open'?'空番':esc(s.start)+' 〜 '+esc(s.end)}</small></span><span class="tag">勤務詳細 ›</span></button>`+data.events.map((e,i)=>`<button class="entry" data-event="${i}"><span><strong>${esc(e.title)}</strong><small>${esc(e.time||'時間指定なし')}</small></span><span class="tag">詳細 ›</span></button>`).join('');$('shiftEntry').onclick=()=>openShift();document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>openEvent(Number(b.dataset.event)));}
function show(content){$('modal').innerHTML=`<div class="shade" id="shade"><div class="sheet" role="dialog" aria-modal="true">${content}</div></div>`;$('shade').onclick=e=>{if(e.target.id==='shade')close()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close)}function close(){$('modal').innerHTML=''}function head(title){return `<div class="sheethead"><h3>${title}</h3><button class="close" data-close aria-label="閉じる">×</button></div>`}
function openShift(edit=false){let s=getDay(selected).shift;if(!edit){show(head('勤務詳細')+`<div class="detail"><div><b>元の勤務</b>${esc(s.base||'—')}</div><div><b>状態</b>${esc(({normal:'通常勤務',off:'公休',open:'空番',unset:'輪番未設定',assigned:'勤務追加・変更',paid:'有給'})[s.mode])}</div><div><b>最終ダイヤ</b>${esc(s.mode==='paid'?'有給':s.duty||'—')}</div><div><b>出勤</b>${esc(s.mode==='paid'?'—':s.start||'—')}</div><div><b>退勤</b>${esc(s.mode==='paid'?'—':s.end||'—')}</div>${midInfo(s)||'<div><b>中間開放</b>登録なし</div>'}</div><div class="actions"><button class="primary" id="editShift">勤務を編集</button><button class="secondary" data-close>閉じる</button></div><p class="note">試作品の勤務データは仮のものです。元の勤務と変更後の勤務は別々に保持します。</p>`);$('editShift').onclick=()=>openShift(true);document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);return}show(head('勤務を編集')+`<form id="shiftForm"><label class="field">元の勤務<input name="base" value="${esc(s.base)}" placeholder="公休／空番／古賀1A"></label><label class="field">勤務状態<select name="mode">${[['normal','通常勤務'],['off','公休'],['open','空番'],['assigned','公休・空番から出勤／勤務変更'],['paid','有給']].map(([v,t])=>`<option value="${v}" ${s.mode===v?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">最終ダイヤ<input name="duty" value="${esc(s.duty)}" placeholder="例：古賀1A"></label><label class="field">出勤時間<input name="start" type="time" value="${esc(s.start.length===4?'0'+s.start:s.start)}"></label><label class="field">退勤時間<input name="end" type="time" value="${esc(s.end.length===4?'0'+s.end:s.end)}"></label><label class="field">中間開放開始（中休のみ）<input name="midStart" type="time" value="${esc(s.midStart||'')}"></label><label class="field">中間開放終了（中休のみ）<input name="midEnd" type="time" value="${esc(s.midEnd||'')}"></label><div class="actions"><button class="primary" type="submit">保存する</button><button class="secondary" type="button" data-close>キャンセル</button></div></form>`);$('shiftForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),k=key(year,month,selected);store[k]??={};const a=f.get('midStart'),b=f.get('midEnd');if(Boolean(a)!==Boolean(b)){alert('中間開放の開始と終了は両方入力してください。');return}if(a&&!(minutes(f.get('start'))<=minutes(a)&&minutes(a)<minutes(b)&&minutes(b)<=minutes(f.get('end')))){alert('中間開放の時刻を確認してください。');return}store[k].shift=Object.fromEntries(['base','mode','duty','start','end','midStart','midEnd'].map(n=>[n,f.get(n)]));save();close();render()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close)}
function openEvent(i=null){let k=key(year,month,selected),ev=getDay(selected).events[i]||{title:'',time:'',memo:''};show(head(i===null?'予定を追加':'予定の詳細・編集')+`<form id="eventForm"><label class="field">予定名<input name="title" required maxlength="100" value="${esc(ev.title)}" placeholder="例：ジム、買い物、韓国語"></label><label class="field">時間（自由入力）<input name="time" maxlength="80" value="${esc(ev.time)}" placeholder="例：10:00〜11:30"></label><label class="field">メモ<textarea name="memo" placeholder="場所や持ち物など">${esc(ev.memo)}</textarea></label><div class="actions"><button class="primary" type="submit">保存する</button><button class="secondary" type="button" data-close>キャンセル</button>${i!==null?'<button class="secondary danger" type="button" id="deleteEvent">削除</button>':''}</div></form>`);$('eventForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);store[k]??={};store[k].events??=[];let item=Object.fromEntries(['title','time','memo'].map(n=>[n,f.get(n)]));if(i===null)store[k].events.push(item);else store[k].events[i]=item;save();close();render()};if(i!==null)$('deleteEvent').onclick=()=>{if(confirm('この予定を削除しますか？')){store[k]??={};store[k].events??=getDay(selected).events;store[k].events.splice(i,1);save();close();render()}};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close)}
// Ver.0.4: device-to-device JSON backup. Export both persisted data sets without sending data to a server.
function exportPlanner(){
  try{
    const payload={format:'my-planner-backup',version:1,exportedAt:new Date().toISOString(),roster:roster,store:store};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='my-planner-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(err){alert('書き出しに失敗しました：'+err.message)}
}
function validRoster(r){
  if(r===null)return true;
  if(!r||typeof r!=='object'||Array.isArray(r)||typeof r.anchor!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(r.anchor)||!Array.isArray(r.days)||r.days.length!==28)return false;
  return [r.days,...['sat','holiday'].filter(k=>r[k]!==undefined).map(k=>r[k])].every(arr=>Array.isArray(arr)&&arr.length===28&&arr.every(d=>d&&typeof d==='object'&&['duty','start','end'].every(k=>typeof d[k]==='string'&&d[k].length<=100)));
}
function validStore(v){
  if(!v||typeof v!=='object'||Array.isArray(v))return false;
  const entries=Object.entries(v);if(entries.length>10000)return false;
  return entries.every(([k,d])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&d&&typeof d==='object'&&!Array.isArray(d)&&
    (d.shift===undefined||(d.shift&&typeof d.shift==='object'&&['base','mode','duty','start','end'].every(n=>typeof d.shift[n]==='string'&&d.shift[n].length<=200)&&['midStart','midEnd'].every(n=>d.shift[n]===undefined||(typeof d.shift[n]==='string'&&d.shift[n].length<=200))))&&
    (d.events===undefined||(Array.isArray(d.events)&&d.events.length<=100&&d.events.every(e=>e&&typeof e==='object'&&['title','time','memo'].every(n=>typeof e[n]==='string'&&e[n].length<=10000)))));
}
async function importPlanner(file){
  if(!file)return;
  if(file.size>5*1024*1024){alert('ファイルが大きすぎます（上限5MB）。');return}
  try{
    const payload=JSON.parse(await file.text());
    if(!payload||payload.format!=='my-planner-backup'||payload.version!==1||!validRoster(payload.roster)||!validStore(payload.store))throw Error('このアプリのバックアップ形式ではないか、内容が不正です。');
    const existing=Boolean(roster?.anchor)||Object.keys(store).length>0;
    const question='バックアップを読み込みますか？\n\n輪番設定：'+(payload.roster?.anchor?'あり':'なし')+'\n予定を保存した日数：'+Object.keys(payload.store).length+'日'+(existing?'\n\n【注意】この端末の現在の輪番設定・予定はすべて上書きされます。必要なら先に「書き出す」でバックアップしてください。':'');
    if(!confirm(question))return;
    const newRoster=JSON.stringify(payload.roster),newStore=JSON.stringify(payload.store);
    // Keep the current in-memory state unchanged until both writes succeed.
    const oldRoster=localStorage.getItem(rosterKey),oldStore=localStorage.getItem('planner_demo_v1');
    try{localStorage.setItem(rosterKey,newRoster);localStorage.setItem('planner_demo_v1',newStore)}catch(e){
      if(oldRoster===null)localStorage.removeItem(rosterKey);else localStorage.setItem(rosterKey,oldRoster);
      if(oldStore===null)localStorage.removeItem('planner_demo_v1');else localStorage.setItem('planner_demo_v1',oldStore);
      throw e;
    }
    roster=payload.roster;store=payload.store;render();alert('読み込みが完了しました！');
  }catch(err){alert('読み込みに失敗しました：'+err.message)}
}
if(roster?.anchor&&Array.isArray(roster.days)&&roster.days.length===28){let changed=false;for(const kind of ['sat','holiday'])if(!Array.isArray(roster[kind])){roster[kind]=seededDays(kind);changed=true}if(changed)localStorage.setItem(rosterKey,JSON.stringify(roster))}
$('exportData').onclick=exportPlanner;
$('importData').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{const file=e.target.files?.[0];await importPlanner(file);e.target.value=''};
$('add').onclick=()=>openEvent();$('rosterBtn').onclick=()=>openRoster();function move(n){month+=n;if(month<0){year--;month=11}if(month>11){year++;month=0}selected=1;render()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('todayBtn').onclick=()=>{year=now.getFullYear();month=now.getMonth();selected=now.getDate();render()};render();
</script></body></html>
