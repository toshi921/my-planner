<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>わたしの手帳 | Ver.0.2</title><style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#203044;--sub:#708096;--line:#e6ebf1;--blue:#3178c6;--off:#f6ead4;--paid:#dff3e9;--weekend:#fbf5f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1000px;margin:auto;min-height:100vh;background:var(--card)}header{padding:18px 18px 12px;border-bottom:1px solid var(--line)}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:12px;color:var(--sub);letter-spacing:.1em}.title{font-size:22px;font-weight:800}.nav{display:flex;align-items:center;gap:8px}.iconbtn{border:1px solid var(--line);background:white;border-radius:12px;padding:8px 12px;font-size:18px}.today{border:1px solid var(--line);background:#f6f9fd;color:var(--blue);border-radius:10px;padding:7px 10px;font-size:12px}.hint{font-size:12px;color:var(--sub);margin-top:9px}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{border-bottom:1px solid var(--line)}.weekdays span{text-align:center;padding:10px 0;font-size:12px;font-weight:700;color:var(--sub)}.weekdays span:first-child{color:#d36b69}.weekdays span:last-child{color:#5688c3}.day{min-width:0;min-height:111px;padding:5px 3px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:white;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden}.day:nth-child(7n+1){background:#fffafa}.day:nth-child(7n){background:#f9fbff}.day.outside{background:#f4f6f9}.day.selected{box-shadow:inset 0 0 0 2px var(--blue);background:#f1f7ff}.daynum{font-size:12px;font-weight:700;padding:0 2px 2px}.daynum.todaynum{background:var(--blue);color:white;border-radius:100px;display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px}.shift{display:flex;flex-direction:column;gap:1px;border-radius:4px;background:#eaf3fc;padding:3px 2px;max-width:100%}.shift.off{background:#fff0d8}.shift.paid{background:#e1f5e8}.shift span{display:block;font-size:10px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shift span:first-child{font-weight:800}.event{display:block;font-size:10px;line-height:1.3;padding:2px;border-radius:3px;background:#f1e9fb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{font-size:10px;color:var(--blue);padding-left:2px}.bottom{padding:18px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-title h2{font-size:17px;margin:0}.primary{background:var(--blue);color:white;border:0;border-radius:12px;padding:10px 13px;font-size:13px;font-weight:700}.entry{display:flex;align-items:center;justify-content:space-between;padding:13px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:white;text-align:left;width:100%;gap:10px}.entry strong{font-size:14px}.entry small{color:var(--sub);display:block;margin-top:3px}.tag{font-size:11px;color:var(--blue);background:#eaf3fc;padding:5px 7px;border-radius:8px;white-space:nowrap}.shade{position:fixed;inset:0;background:#10223878;z-index:5;display:flex;align-items:flex-end;justify-content:center}.sheet{background:white;width:100%;max-width:550px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px;box-shadow:0 -8px 30px #15263c22}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.sheet h3{margin:0;font-size:20px}.close{border:0;background:#edf1f5;border-radius:50%;width:34px;height:34px;font-size:18px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0;font-size:13px;font-weight:700}.field input,.field select,.field textarea{border:1px solid #cfd8e3;border-radius:10px;padding:12px;width:100%;background:white;color:var(--ink)}.field textarea{min-height:90px}.actions{display:flex;gap:8px;margin-top:16px}.actions button{flex:1}.secondary{border:1px solid var(--line);border-radius:12px;background:white;padding:10px}.danger{color:#b83d43}.note{font-size:12px;color:var(--sub);line-height:1.6}.mini{font-size:13px;color:var(--sub)}.empty{color:var(--sub);font-size:13px}.detail{background:#f5f8fc;border-radius:14px;padding:14px;line-height:1.8}.detail b{display:inline-block;min-width:76px}.footer{padding:12px 18px 25px;color:var(--sub);font-size:11px;border-top:1px solid var(--line)}@media(min-width:650px){.day{min-height:137px;padding:7px}.shift span,.event{font-size:12px}.daynum{font-size:14px}.sheet{border-radius:20px;margin:auto;max-height:85vh}.shade{align-items:center}}@media(max-width:380px){.day{min-height:102px;padding:3px 2px}.shift span,.event,.more{font-size:9px}.shift{padding:2px 1px}.title{font-size:19px}}
/* Ver.0.2: mobile readability improvements; dates unchanged */
.shift span{font-size:12px;font-weight:750;line-height:1.35;color:#172b42;letter-spacing:-.2px}
.shift span:first-child{font-size:12px;font-weight:850}
.shift{gap:1px;padding:4px 2px}
.day{min-height:122px}
.event{font-size:11px;font-weight:650;color:#3a2655}
.more{font-size:11px;font-weight:700}
@media(min-width:650px){.shift span{font-size:13px}.shift span:first-child{font-size:13px}.day{min-height:145px}}
@media(max-width:380px){.day{min-height:117px;padding:3px 1px}.shift{padding:3px 1px}.shift span{font-size:11px;letter-spacing:-.35px}.shift span:first-child{font-size:11px}.event,.more{font-size:10px}}
</style></head><body><main class="app"><header><div class="top"><div><div class="brand">MY PLANNER · Ver.0.2</div><div class="title" id="monthTitle"></div></div><div class="nav"><button class="iconbtn" id="prev" aria-label="前の月">‹</button><button class="today" id="todayBtn">今月</button><button class="iconbtn" id="next" aria-label="次の月">›</button></div></div><div class="hint">日付をタップ → 予定一覧 ／ 予定をタップ → 詳細・編集</div></header><div class="weekdays"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div class="calendar" id="calendar"></div><section class="bottom"><div class="section-title"><h2 id="selectedTitle"></h2><button class="primary" id="add">＋ 予定を追加</button></div><div id="dayEntries"></div></section><div class="footer">Ver.0.2：勤務は表示例で、実際の輪番・加給表とは未連携です。入力した予定・勤務変更は、このブラウザ内に保存されます。</div></main><div id="modal"></div><script>
const $=id=>document.getElementById(id), now=new Date();let year=now.getFullYear(),month=now.getMonth(),selected=now.getDate();const key=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;let store={};try{store=JSON.parse(localStorage.getItem('planner_demo_v1')||'{}')}catch(e){};const save=()=>localStorage.setItem('planner_demo_v1',JSON.stringify(store));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sample(d){let n=(d+month*3)%11;if(n===0)return {base:'公休',mode:'off',duty:'',start:'',end:''};if(n===1)return {base:'空番',mode:'open',duty:'',start:'',end:''};if(n===2)return {base:'公休',mode:'assigned',duty:'津1B',start:'8:00',end:'17:10'};if(n===3)return {base:'空番',mode:'assigned',duty:'香椎34A',start:'9:10',end:'18:30'};if(n===4)return {base:'古賀2',mode:'paid',duty:'',start:'',end:''};return {base:'古賀1A',mode:'normal',duty:'古賀1A',start:'6:30',end:'15:10'}}
function getDay(d){const k=key(year,month,d);return {shift:store[k]?.shift||sample(d),events:store[k]?.events||[]}}
function lines(s){if(s.mode==='paid')return [s.base||s.duty||'勤務','有給'];if(s.mode==='off')return ['公休'];if(s.mode==='open')return ['空番'];if(s.mode==='assigned')return [s.base||'空番',s.duty||'ダイヤ未設定',s.start||'—',s.end||'—'];return [s.duty||s.base||'勤務',s.start||'—',s.end||'—']}
function render(){ $('monthTitle').textContent=`${year}年 ${month+1}月`;const first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),total=Math.ceil((first+days)/7)*7;let html='';for(let i=0;i<total;i++){const d=i-first+1;if(d<1||d>days){html+='<div class="day outside"></div>';continue}const data=getDay(d),s=data.shift,items=lines(s),room=Math.max(0,6-items.length);const today=year===now.getFullYear()&&month===now.getMonth()&&d===now.getDate();html+=`<button class="day ${d===selected?'selected':''}" data-day="${d}"><span class="daynum ${today?'todaynum':''}">${d}</span><span class="shift ${s.mode==='paid'?'paid':s.mode==='off'||s.mode==='assigned'?'off':''}">${items.map(x=>`<span>${esc(x)}</span>`).join('')}</span>${data.events.slice(0,room).map(e=>`<span class="event">${esc(e.title)}</span>`).join('')}${data.events.length>room?`<span class="more">＋${data.events.length-room}件</span>`:''}</button>`} $('calendar').innerHTML=html;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.day);render();$('selectedTitle').scrollIntoView({behavior:'smooth',block:'nearest'})});$('selectedTitle').textContent=`${month+1}月${selected}日（${'日月火水木金土'[new Date(year,month,selected).getDay()]}）の予定`;const data=getDay(selected),s=data.shift;$('dayEntries').innerHTML=`<button class="entry" id="shiftEntry"><span><strong>${esc(lines(s)[0])}${s.mode==='paid'?' → 有給':s.mode==='assigned'?' → '+esc(s.duty):''}</strong><small>${s.mode==='paid'?'有給取得':s.mode==='off'?'公休':s.mode==='open'?'空番':esc(s.start)+' 〜 '+esc(s.end)}</small></span><span class="tag">勤務詳細 ›</span></button>`+data.events.map((e,i)=>`<button class="entry" data-event="${i}"><span><strong>${esc(e.title)}</strong><small>${esc(e.time||'時間指定なし')}</small></span><span class="tag">詳細 ›</span></button>`).join('');$('shiftEntry').onclick=()=>openShift();document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>openEvent(Number(b.dataset.event)));}
function show(content){$('modal').innerHTML=`<div class="shade" id="shade"><div class="sheet" role="dialog" aria-modal="true">${content}</div></div>`;$('shade').onclick=e=>{if(e.target.id==='shade')close()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close)}function close(){$('modal').innerHTML=''}function head(title){return `<div class="sheethead"><h3>${title}</h3><button class="close" data-close aria-label="閉じる">×</button></div>`}
function openShift(edit=false){let s=getDay(selected).shift;if(!edit){show(head('勤務詳細')+`<div class="detail"><div><b>元の勤務</b>${esc(s.base||'—')}</div><div><b>状態</b>${esc(({normal:'通常勤務',off:'公休',open:'空番',assigned:'勤務追加・変更',paid:'有給'})[s.mode])}</div><div><b>最終ダイヤ</b>${esc(s.mode==='paid'?'有給':s.duty||'—')}</div><div><b>出勤</b>${esc(s.mode==='paid'?'—':s.start||'—')}</div><div><b>退勤</b>${esc(s.mode==='paid'?'—':s.end||'—')}</div><div><b>待機・休憩</b>今後の機能</div></div><div class="actions"><button class="primary" id="editShift">勤務を編集</button><button class="secondary" data-close>閉じる</button></div><p class="note">試作品の勤務データは仮のものです。元の勤務と変更後の勤務は別々に保持します。</p>`);$('editShift').onclick=()=>openShift(true);document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);return}show(head('勤務を編集')+`<form id="shiftForm"><label class="field">元の勤務<input name="base" value="${esc(s.base)}" placeholder="公休／空番／古賀1A"></label><label class="field">勤務状態<select name="mode">${[['normal','通常勤務'],['off','公休'],['open','空番'],['assigned','公休・空番から出勤／勤務変更'],['paid','有給']].map(([v,t])=>`<option value="${v}" ${s.mode===v?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">最終ダイヤ<input name="duty" value="${esc(s.duty)}" placeholder="例：古賀1A"></label><label class="field">出勤時間<input name="start" type="time" value="${esc(s.start.length===4?'0'+s.start:s.start)}"></label><label class="field">退勤時間<input name="end" type="time" value="${esc(s.end.length===4?'0'+s.end:s.end)}"></label><div class="actions"><button class="primary" type="submit">保存する</button><button class="secondary" type="button" data-close>キャンセル</button></div></form>`);$('shiftForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),k=key(year,month,selected);store[k]??={};store[k].shift=Object.fromEntries(['base','mode','duty','start','end'].map(n=>[n,f.get(n)]));save();close();render()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close)}
function openEvent(i=null){let k=key(year,month,selected),ev=getDay(selected).events[i]||{title:'',time:'',memo:''};show(head(i===null?'予定を追加':'予定の詳細・編集')+`<form id="eventForm"><label class="field">予定名<input name="title" required maxlength="100" value="${esc(ev.title)}" placeholder="例：ジム、買い物、韓国語"></label><label class="field">時間（自由入力）<input name="time" maxlength="80" value="${esc(ev.time)}" placeholder="例：10:00〜11:30"></label><label class="field">メモ<textarea name="memo" placeholder="場所や持ち物など">${esc(ev.memo)}</textarea></label><div class="actions"><button class="primary" type="submit">保存する</button><button class="secondary" type="button" data-close>キャンセル</button>${i!==null?'<button class="secondary danger" type="button" id="deleteEvent">削除</button>':''}</div></form>`);$('eventForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);store[k]??={};store[k].events??=[];let item=Object.fromEntries(['title','time','memo'].map(n=>[n,f.get(n)]));if(i===null)store[k].events.push(item);else store[k].events[i]=item;save();close();render()};if(i!==null)$('deleteEvent').onclick=()=>{if(confirm('この予定を削除しますか？')){store[k]??={};store[k].events??=getDay(selected).events;store[k].events.splice(i,1);save();close();render()}};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close)}
$('add').onclick=()=>openEvent();function move(n){month+=n;if(month<0){year--;month=11}if(month>11){year++;month=0}selected=1;render()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('todayBtn').onclick=()=>{year=now.getFullYear();month=now.getMonth();selected=now.getDate();render()};render();
</script></body></html>
